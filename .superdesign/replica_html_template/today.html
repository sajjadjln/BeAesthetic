<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پیکر Today (v4 baseline)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: three Today phones on a quiet board, one shared sample day and one shared clock, notes under each phone.
   Phone colors are the app's slate tokens (DESIGN.md, D136), green accent. Dark first. */
:root {
  --page-bg: #121614; --page-fg: #E6EAE8; --page-muted: #94A09B; --page-line: #2A312E; --page-chip: #1E2422; --page-acc: #5BD994;
  --bg:#1B201E; --sf:#252B29; --sf2:#2F3633; --bd:#3C4441; --t1:#EEF1EF; --t2:#A1ABA7; --t3:#828C88; --on-acc:#0E1110;
  --acc:#34C47A; --acc-sub:#29503C; --acc-on:#5BD994; --w0:#3C4441; --w1:#23513A; --w2:#28754E; --w3:#2FA066; --w4:#5BD994;
  --sp:#5560C9; --sp-sub:#313953; --sp-on:#A3AAF2; --nt:#E8B04B; --nt-sub:#4C4630;
  --frame:#323936; --scrim: rgba(0,0,0,.55); --shadow: rgba(0,0,0,.5);
  --font-ui: "Estedad", "Vazirmatn", "Noto Sans Arabic", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --page-bg:#E7EBE9; --page-fg:#121614; --page-muted:#5A6560; --page-line:#CDD4D0; --page-chip:#F6F7F6; --page-acc:#1D8A55;
    --bg:#F6F7F6; --sf:#FFFFFF; --sf2:#EDF0EE; --bd:#DCE1DE; --t1:#0E1110; --t2:#5F6965; --t3:#8A948F; --on-acc:#FFFFFF;
    --acc:#1D8A55; --acc-sub:#E4F7EC; --acc-on:#176B43; --w0:#DCE1DE; --w1:#C4F0D6; --w2:#93E6B6; --w3:#22A565; --w4:#176B43;
    --sp:#8C95EA; --sp-sub:#D3D7F8; --sp-on:#3E479E; --nt:#B07610; --nt-sub:#FBEFD6;
    --frame:#C9D0CC; --scrim: rgba(14,17,16,.32); --shadow: rgba(20,30,25,.22);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --page-bg:#E7EBE9; --page-fg:#121614; --page-muted:#5A6560; --page-line:#CDD4D0; --page-chip:#F6F7F6; --page-acc:#1D8A55;
  --bg:#F6F7F6; --sf:#FFFFFF; --sf2:#EDF0EE; --bd:#DCE1DE; --t1:#0E1110; --t2:#5F6965; --t3:#8A948F; --on-acc:#FFFFFF;
  --acc:#1D8A55; --acc-sub:#E4F7EC; --acc-on:#176B43; --w0:#DCE1DE; --w1:#C4F0D6; --w2:#93E6B6; --w3:#22A565; --w4:#176B43;
  --sp:#8C95EA; --sp-sub:#D3D7F8; --sp-on:#3E479E; --nt:#B07610; --nt-sub:#FBEFD6;
  --frame:#C9D0CC; --scrim: rgba(14,17,16,.32); --shadow: rgba(20,30,25,.22);
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--page-bg); color: var(--page-fg); font-family: var(--font-ui); margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 32px 72px; padding-inline: 16px; }
.intro { display: grid; gap: 10px; margin-bottom: 22px; max-width: 720px; }
.intro h1 { font-size: 30px; font-weight: 800; margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--page-muted); font-size: 15px; line-height: 1.7; }

/* Clock control */
.clock { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  background: var(--page-bg); padding-block: 12px; margin-bottom: 26px; border-bottom: 1px solid var(--page-line); }
.clock .lbl { font-size: 13px; font-weight: 600; color: var(--page-muted); letter-spacing: .04em; text-transform: uppercase; }
.clock .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.clock button { font: inherit; font-size: 14px; font-weight: 600; color: var(--page-fg); background: var(--page-chip); border: 1px solid var(--page-line);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.clock button[aria-pressed="true"] { background: var(--page-acc); color: var(--on-acc); border-color: transparent; }
.clock button:focus-visible { outline: 2px solid var(--page-acc); outline-offset: 2px; }
.p { direction: rtl; unicode-bidi: isolate; }
.clock .fa { font-family: var(--font-ui); direction: rtl; }
.clock .hint { font-size: 13px; color: var(--page-muted); }

.gallery { display: flex; flex-wrap: wrap; gap: 48px 32px; justify-content: center; align-items: flex-start; }
figure { margin: 0; width: 360px; max-width: 100%; display: grid; gap: 14px; }
figcaption { display: grid; gap: 8px; font-size: 14px; color: var(--page-muted); line-height: 1.6; }
figcaption .name { display: flex; align-items: baseline; gap: 10px; color: var(--page-fg); }
figcaption .name b { font-size: 18px; }
figcaption .letter { font-size: 13px; font-weight: 800; border: 1.5px solid currentColor; border-radius: 8px; padding: 0 7px; }
figcaption .rec { font-size: 12px; font-weight: 700; color: var(--page-acc); border: 1px solid var(--page-acc); border-radius: 999px; padding: 0 8px; }
figcaption ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; }
figcaption li b { color: var(--page-fg); font-weight: 600; }
.minus { color: var(--page-muted); }

.shared { margin-top: 64px; border-top: 1px solid var(--page-line); padding-top: 28px; display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.shared h2 { grid-column: 1 / -1; margin: 0; font-size: 20px; font-weight: 800; }
.shared section { display: grid; gap: 6px; align-content: start; }
.shared h3 { margin: 0; font-size: 15px; font-weight: 700; }
.shared p { margin: 0; font-size: 14px; color: var(--page-muted); line-height: 1.7; }

/* ---------- Phone shell ---------- */
.phone { position: relative; width: 360px; max-width: 100%; height: 780px; background: var(--bg); color: var(--t1); border-radius: 32px; overflow: hidden;
  border: 1px solid var(--frame); box-shadow: 0 24px 60px -24px var(--shadow); font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  display: flex; flex-direction: column; isolation: isolate; }
:where(.phone) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: start; }
:where(.phone) button:focus-visible, :where(.phone) input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 12px; }
.status { display: flex; justify-content: space-between; padding: 12px 22px 0; font-size: 12px; font-weight: 600; color: var(--t2); flex: none; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.body { display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 24px; }
.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.sm { width: 18px; height: 18px; } .i.xs { width: 14px; height: 14px; stroke-width: 2.6; } .i.lg { width: 30px; height: 30px; }
.i.fill { fill: currentColor; stroke: none; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.c2 { color: var(--t2); } .c3 { color: var(--t3); } .cacc { color: var(--acc-on); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.9; flex: none; }
.chip.acc { background: var(--acc-sub); color: var(--acc-on); }
.chip.nt { background: var(--nt-sub); color: var(--nt); }
.chip.neu { background: var(--sf2); color: var(--t2); }
.num { font-variant-numeric: tabular-nums; }

/* Nav: icons only, Today active */
.nav { flex: none; height: 64px; display: flex; justify-content: space-around; align-items: center; padding: 0 16px 6px; border-top: 1px solid var(--bd); background: var(--bg); position: relative; z-index: 3; }
.nav span { width: 60px; height: 44px; display: grid; place-items: center; color: var(--t3); position: relative; }
.nav span.on { color: var(--t1); }
.nav span.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--acc); }

/* Header */
.hdr { display: flex; align-items: center; gap: 6px; }
.hdr .d1 { font-size: 24px; font-weight: 800; line-height: 1.35; }
.hdr .d2 { font-size: 13px; color: var(--t2); }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--t2); background: var(--sf); flex: none; }
.round.acc { background: var(--acc); color: var(--on-acc); }

/* Ring */
.ring { position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring .trk { stroke: var(--sf2); }
.ring .val { stroke: var(--acc); transition: stroke-dashoffset .35s cubic-bezier(.2,0,0,1); }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .small { color: var(--t2); }
.week { display: flex; gap: 8px; }
.wd { width: 12px; height: 12px; border-radius: 50%; background: var(--w0); }
.wd.l1 { background: var(--w1); } .wd.l2 { background: var(--w2); } .wd.l3 { background: var(--w3); } .wd.l4 { background: var(--w4); }
.wd.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--acc); }
.wd.fu { background: transparent; box-shadow: inset 0 0 0 1.5px var(--bd); }

/* Character */
.buddy { flex: none; display: grid; place-items: center; }
.buddy svg { width: 100%; height: 100%; display: block; }
.bubble { position: relative; background: var(--sf2); border-radius: 14px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; line-height: 1.6; }

/* Workout card (D126) */
.wk { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--sf); }
.wk .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--sf2); color: var(--t2); flex: none; }
.wk .t { font-size: 12px; color: var(--t2); }
.wk .n { font-size: 16px; font-weight: 700; line-height: 1.4; }
.wk .s { font-size: 12.5px; color: var(--t2); }
.wk .play { width: 46px; height: 46px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; flex: none; }
.wk.done { background: var(--acc-sub); }
.wk.done .ic { background: transparent; color: var(--acc-on); }
.wk.done .s { color: var(--acc-on); }
.ck { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--bd); display: grid; place-items: center; flex: none; transition: background .2s; }
.ck .i { opacity: 0; color: var(--on-acc); }
.ck.on { background: var(--acc); box-shadow: none; }
.ck.on .i { opacity: 1; }

/* Section head */
.sh { display: flex; align-items: center; gap: 8px; }
.sh .ti { font-size: 17px; font-weight: 800; }
.sh .pi { color: var(--acc-on); }
.sh .cnt { margin-inline-start: auto; font-size: 13px; color: var(--t2); font-variant-numeric: tabular-nums; }

/* Tiles (A) */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px; min-height: 96px; padding: 14px; border-radius: 20px; background: var(--sf); transition: background .2s; }
.tile .ic { color: var(--t2); }
.tile .lb { font-size: 15px; font-weight: 600; line-height: 1.45; }
.tile .ok { position: absolute; top: 12px; inset-inline-end: 12px; width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--bd); display: grid; place-items: center; }
.tile .ok .i { opacity: 0; color: var(--on-acc); }
.tile .lbw { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.tile.imp, .tile.due { box-shadow: inset 0 0 0 1.5px var(--nt); }
.tile.on { background: var(--acc-sub); box-shadow: none; }
.tile.on .ic { color: var(--acc-on); }
.tile.on .ok { background: var(--acc); box-shadow: none; }
.tile.on .ok .i { opacity: 1; }
.tile.on .tag { display: none; }

/* Rows (lists) */
.rows { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; width: 100%; }
.lrow .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--sf2); color: var(--t2); flex: none; }
.lrow .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.lrow.on .nm { color: var(--t3); }
.lrow.on .ic { background: var(--acc-sub); color: var(--acc-on); }
.lrow + .lrow { border-top: 1px solid var(--bd); }
.rows.big .lrow { min-height: 62px; }
.rows.big .lrow .ic { width: 42px; height: 42px; border-radius: 13px; }
.rows.big .lrow .nm { font-size: 16px; font-weight: 600; }
.rows.big .lrow.on .nm { font-weight: 500; }
.lrow.imp .ic, .lrow.due .ic { box-shadow: inset 0 0 0 1.5px var(--nt); }
.lrow.on.imp .ic, .lrow.on.due .ic { box-shadow: none; }
.grp { display: flex; align-items: center; gap: 8px; padding: 14px 0 4px; font-size: 13px; font-weight: 700; color: var(--t2); }
.grp .i { color: var(--t3); }
.grp .cnt { margin-inline-start: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.grp .now { color: var(--acc-on); }

/* Accordion card */
.acc { background: var(--sf); border-radius: 18px; }
.acc-h { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 0 16px; }
.acc-h .ti { font-size: 15px; font-weight: 700; flex: 1; }
.acc-h .chev { color: var(--t3); transition: transform .25s cubic-bezier(.2,0,0,1); }
.acc-h[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-b { padding: 0 16px 10px; }
.mini { display: flex; gap: 3px; }
.mini i { display: block; width: 14px; height: 6px; border-radius: 3px; background: var(--w0); position: relative; overflow: hidden; }
.mini i b { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--acc); }

/* Notes */
.note { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--acc-sub); color: var(--acc-on); font-weight: 600; font-size: 14.5px; }
.nextline { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--t2); padding: 2px 4px; }
.nextline b { color: var(--t1); font-weight: 600; }

/* FAB (A) */
.fab { position: absolute; z-index: 2; bottom: 80px; inset-inline-end: 16px; height: 52px; padding: 0 18px 0 20px; border-radius: 18px; background: var(--acc); color: var(--on-acc);
  display: flex; align-items: center; gap: 8px; font-weight: 700; box-shadow: 0 8px 24px -8px var(--shadow); }

/* Bottom sheet (B) */
.bs-scrim { position: absolute; inset: 0 0 64px 0; background: var(--scrim); z-index: 2; opacity: 0; pointer-events: none; transition: opacity .25s; }
.bs-scrim.on { opacity: 1; pointer-events: auto; }
.bs { position: absolute; inset-inline: 0; bottom: 64px; z-index: 3; background: var(--sf); border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px -12px var(--shadow);
  height: 92px; transition: height .35s cubic-bezier(.2,0,0,1); display: flex; flex-direction: column; overflow: hidden; }
.bs.open { height: 82%; }
.bs .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--bd); margin: 8px auto 2px; flex: none; }
.bs-h { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px; flex: none; }
.bs-h .tap { flex: 1; display: grid; gap: 4px; min-height: 52px; align-content: center; }
.bs-h .ti { font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.bs-b { flex: 1; overflow-y: auto; padding: 0 16px 16px; scrollbar-width: none; }
.bs-b::-webkit-scrollbar { display: none; }

/* Day strip + focus (C) */
.strip { display: grid; gap: 8px; }
.strip .top { display: flex; align-items: baseline; gap: 8px; }
.strip .top .n { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seg { display: grid; gap: 6px; position: relative; }
.seg .bar { height: 10px; border-radius: 5px; background: var(--w0); position: relative; overflow: hidden; }
.seg .bar b { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--acc); border-radius: 5px; transition: width .35s cubic-bezier(.2,0,0,1); }
.seg .lb { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--t3); }
.seg.cur .lb { color: var(--t1); font-weight: 700; }
.seg .pin { position: absolute; top: -5px; width: 3px; height: 20px; border-radius: 2px; background: var(--t1); box-shadow: 0 0 0 2px var(--bg); }
.focus { background: var(--sf); border-radius: 22px; padding: 16px; display: grid; gap: 14px; }
.focus .hd { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t2); font-weight: 600; }
.focus .hd .pi { color: var(--acc-on); }
.focus .main { display: flex; align-items: center; gap: 14px; }
.focus .main .ic { width: 56px; height: 56px; border-radius: 18px; background: var(--sf2); display: grid; place-items: center; color: var(--t1); flex: none; }
.focus .main .nm { font-size: 21px; font-weight: 800; line-height: 1.35; }
.focus .main .sub { font-size: 13px; color: var(--t2); }
.focus .go { height: 54px; border-radius: 16px; background: var(--acc); color: var(--on-acc); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 14px; border-radius: 12px; background: var(--sf2); font-size: 14px; font-weight: 500; }
.tchip .i { color: var(--t2); }
.tchip.on { background: var(--acc-sub); color: var(--acc-on); }
.tchip.on .i { color: var(--acc-on); }
.tchip.imp, .tchip.due { box-shadow: inset 0 0 0 1.5px var(--nt); }
.tchip.on.imp, .tchip.on.due { box-shadow: none; }
.parts { display: grid; gap: 8px; }

/* Add sheet (shared) */
.add-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 8; }
.add { position: absolute; inset-inline: 0; bottom: 0; z-index: 9; background: var(--sf); border-radius: 28px 28px 0 0; padding: 10px 16px 22px; display: grid; gap: 14px; box-shadow: 0 -10px 30px -12px var(--shadow); }
.add .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--bd); margin: 0 auto; }
.add .ti { font-size: 18px; font-weight: 800; }
.add input { font: inherit; font-size: 16px; color: var(--t1); background: var(--sf2); border: 0; border-radius: 14px; height: 52px; padding: 0 14px; width: 100%; }
.add input::placeholder { color: var(--t3); }
.add .k { font-size: 13px; font-weight: 600; color: var(--t2); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { height: 38px; padding: 0 14px; border-radius: 999px; background: var(--sf2); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; }
.pill[aria-pressed="true"] { background: var(--acc-sub); color: var(--acc-on); font-weight: 700; }
.add .where { font-size: 13px; color: var(--t2); display: flex; gap: 6px; align-items: center; }
.add .more { font-size: 14px; color: var(--acc-on); font-weight: 600; }
.add .save { height: 52px; border-radius: 16px; background: var(--acc); color: var(--on-acc); font-weight: 700; font-size: 16px; width: 100%; text-align: center; }

/* ---------- v4: the mix ---------- */
.clock .k { font-size: 13px; color: var(--page-muted); font-weight: 600; }
.clock .sep { width: 1px; height: 22px; background: var(--page-line); }
.solo { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 400px); gap: 28px 48px; justify-content: center; align-items: start; }
@media (max-width: 860px) { .solo { grid-template-columns: minmax(0, 360px); } }
.notes { display: grid; gap: 18px; font-size: 14px; color: var(--page-muted); line-height: 1.7; }
.notes h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--page-fg); }
.notes ol { margin: 0; padding-inline-start: 20px; display: grid; gap: 8px; }
.notes b { color: var(--page-fg); font-weight: 600; }
.notes .from { font-size: 12px; font-weight: 700; border: 1px solid var(--page-line); border-radius: 6px; padding: 0 6px; margin-inline-start: 4px; color: var(--page-fg); }
.notes .q { border-top: 1px solid var(--page-line); padding-top: 16px; }

.top { display: flex; align-items: center; gap: 10px; }
.bubble.tail { align-self: flex-start; }
.bubble.tail::before { content: ""; position: absolute; top: 14px; inset-inline-start: -5px; width: 11px; height: 11px; background: var(--sf2); transform: rotate(45deg); border-radius: 2px; }

/* Now: minimal list */
.nl { display: flex; flex-direction: column; }
.nrow { display: flex; align-items: center; gap: 12px; min-height: 46px; width: 100%; }
.nrow .box { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--bd); display: grid; place-items: center; flex: none; transition: background .2s; }
.nrow .box .i { opacity: 0; color: var(--on-acc); }
.nrow.on .box { background: var(--acc); box-shadow: none; }
.nrow.on .box .i { opacity: 1; }
.nrow .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.nrow.on .nm { color: var(--t3); }
.nrow .ti2 { color: var(--t3); }
.nrow.on .ti2 { color: var(--acc-on); }
.nrow .tg { font-size: 12px; font-weight: 600; color: var(--nt); }
.nrow.imp:not(.on) .box, .nrow.due:not(.on) .box { box-shadow: inset 0 0 0 2px var(--nt); }

/* Now: one next task, small */
.nx { display: flex; align-items: center; gap: 12px; background: var(--sf); border-radius: 16px; padding: 8px 8px 8px 14px; }
.nx .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--sf2); color: var(--t2); display: grid; place-items: center; flex: none; }
.nx .nm { font-size: 16px; font-weight: 700; line-height: 1.4; }
.nx .sub { font-size: 12px; color: var(--t2); }
.nx .go2 { width: 44px; height: 44px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; flex: none; }
.chips.sm .tchip { height: 34px; font-size: 13px; padding: 0 10px 0 12px; border-radius: 10px; }

.bs .parts .acc { background: var(--sf2); }
.dock { position: absolute; z-index: 2; bottom: 80px; inset-inline-end: 16px; }
.dock .round { width: 56px; height: 56px; box-shadow: 0 8px 24px -8px var(--shadow); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 420px) { .phone { height: 740px; } }

/* Template: one phone filling a mobile screen (dark, slate tokens, green accent). */
html, body { margin: 0; height: 100%; background: var(--bg); }
.phone { width: 100%; max-width: none; height: 100vh; min-height: 740px; border: 0; border-radius: 0; box-shadow: none; }
</style>
