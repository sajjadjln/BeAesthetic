<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pikar Smooth Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050b12; --fg:#e2f7fb; --muted:#7fa3b0; --accent:#5fd3e6; --line:#1b3d55; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#050b12; } }
  :root[data-theme="dark"] { --bg:#050b12; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:Estedad, system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:16px; }
  .phone { width:min(340px,100%); aspect-ratio:108/234; border-radius:32px; overflow:hidden; background:#050b12;
           box-shadow:0 0 0 1px var(--line), 0 30px 80px #000; }
  svg { width:100%; height:100%; display:block; }
  .bar { display:flex; gap:8px; }
  button { font:inherit; color:var(--fg); background:#0b1622; border:1px solid var(--line); padding:8px 16px; border-radius:10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  p { color:var(--muted); font-size:13px; max-width:340px; text-align:center; line-height:1.8; margin:0; }

  /* timeline (s): same beats as the pixel version, at the app's 1.25× speed */
  .a { animation-fill-mode:both; animation-timing-function:cubic-bezier(.2,.7,.2,1); }
  .sky   { animation:fade 1.1s .0s both; }
  .moon  { animation:rise 1.3s .05s both cubic-bezier(.2,.7,.2,1); }
  .cl-l  { animation:inL 1.1s .4s both, driftL 9s 1.5s ease-in-out infinite alternate; }
  .cl-r  { animation:inR 1.1s .4s both, driftR 11s 1.5s ease-in-out infinite alternate; }
  .land  { animation:up 1s .7s both cubic-bezier(.2,.7,.2,1); }
  .road  { stroke-dasharray:400; stroke-dashoffset:400; animation:draw 1.15s 1.5s forwards ease-in-out; }
  .walker{ offset-rotate:0deg; animation:walk 1.15s 1.5s both ease-in-out, gone .3s 2.6s forwards; }
  .win   { opacity:0; animation:on .25s forwards; }
  .door  { opacity:0; animation:on .5s 2.65s forwards, pulse 2.4s 3.2s ease-in-out infinite; }
  .title { opacity:0; animation:titleIn .9s 3.05s forwards cubic-bezier(.2,.7,.2,1); }
  .shine { animation:shine .9s 3.8s both ease-in-out; }
  .frame { stroke-dasharray:640; stroke-dashoffset:640; animation:draw 1.1s 2.9s forwards ease-in-out; }
  .star  { opacity:0; animation:on 1s 1s forwards, tw 3s 2s ease-in-out infinite; }
  .bat   { opacity:0; animation:on .4s 1.9s forwards; }

  @keyframes fade { from{opacity:0} to{opacity:1} }
  @keyframes on { to{opacity:1} }
  @keyframes rise { from{transform:translateY(34px); opacity:0} to{transform:none; opacity:1} }
  @keyframes up { from{transform:translateY(22px)} to{transform:none} }
  @keyframes inL { from{transform:translateX(-14px); opacity:0} to{transform:none; opacity:1} }
  @keyframes inR { from{transform:translateX(14px); opacity:0} to{transform:none; opacity:1} }
  @keyframes driftL { to{transform:translateX(5px)} }
  @keyframes driftR { to{transform:translateX(-5px)} }
  @keyframes draw { to{stroke-dashoffset:0} }
  @keyframes walk { from{offset-distance:0%} to{offset-distance:100%} }
  @keyframes gone { to{opacity:0} }
  @keyframes pulse { 50%{opacity:.7} }
  @keyframes titleIn { from{opacity:0; transform:translateY(5px); filter:blur(3px)} to{opacity:1; transform:none; filter:blur(0)} }
  @keyframes shine { from{transform:translateX(-60px)} to{transform:translateX(80px)} }
  @keyframes tw { 50%{opacity:.35} }
  @keyframes flap { 50%{transform:scaleY(-.6)} }
  .wing { transform-box:fill-box; transform-origin:center; animation:flap .28s steps(2) infinite; }
  @keyframes fly1 { from{transform:translate(-10px,40px)} to{transform:translate(120px,30px)} }
  @keyframes fly2 { from{transform:translate(120px,26px)} to{transform:translate(-10px,36px)} }
  .f1 { animation:fly1 7s 1.9s linear infinite; }
  .f2 { animation:fly2 9s 2.2s linear infinite; }

  @media (prefers-reduced-motion: reduce) { * { animation-duration:0s !important; animation-delay:0s !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<div class="bar"><button id="replay">پخش دوباره</button></div>
<p>همان اسپلش قلعه، بدون پیکسل: خط‌های صاف، گرادیان و درخشش نرم. همان رنگ‌های شوالیه و همان ترتیب حرکت‌ها، حدود ۴٫۵ ثانیه.</p>

<template id="scene">
<svg viewBox="0 0 108 234" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="skyG" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#1b3d55"/><stop offset=".45" stop-color="#12283a"/><stop offset="1" stop-color="#050b12"/>
    </radialGradient>
    <radialGradient id="moonG" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#b9f1f8"/><stop offset=".55" stop-color="#5fd3e6"/><stop offset="1" stop-color="#2f97ad"/>
    </radialGradient>
    <radialGradient id="haloG"><stop offset=".55" stop-color="#5fd3e6" stop-opacity=".35"/><stop offset="1" stop-color="#5fd3e6" stop-opacity="0"/></radialGradient>
    <radialGradient id="doorG"><stop offset="0" stop-color="#c4f3fa"/><stop offset="1" stop-color="#5fd3e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="landG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071019"/><stop offset="1" stop-color="#020509"/></linearGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6fbff"/><stop offset="1" stop-color="#5fd3e6"/></linearGradient>
    <linearGradient id="shineG" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation=".6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="titleClip"><text x="54" y="40" text-anchor="middle" font-family="Estedad" font-weight="800" font-size="22">پیکر</text></clipPath>
    <path id="roadPath" d="M60 234 C 30 228, 16 220, 34 212 S 76 200, 52 192 S 26 180, 46 172 S 66 162, 58 158 L 54 156"/>
  </defs>

  <rect class="sky" width="108" height="234" fill="url(#skyG)"/>
  <g id="stars"></g>

  <g class="title">
    <text x="54" y="40" text-anchor="middle" font-family="Estedad" font-weight="800" font-size="22" fill="url(#titleG)" filter="url(#glow)">پیکر</text>
    <g clip-path="url(#titleClip)"><rect class="shine" x="20" y="10" width="16" height="40" fill="url(#shineG)" transform="skewX(-20)"/></g>
  </g>

  <g class="moon">
    <circle cx="54" cy="112" r="44" fill="url(#haloG)"/>
    <circle cx="54" cy="112" r="34" fill="url(#moonG)"/>
    <g fill="#2f97ad" opacity=".35">
      <ellipse cx="44" cy="98" rx="7" ry="5"/><ellipse cx="66" cy="104" rx="5" ry="4"/><ellipse cx="58" cy="124" rx="9" ry="5"/>
      <ellipse cx="38" cy="118" rx="4" ry="3"/><ellipse cx="70" cy="92" rx="3" ry="2.4"/><ellipse cx="50" cy="136" rx="5" ry="2.6"/>
    </g>
  </g>

  <g fill="#1b3d55" filter="url(#soft)">
    <g class="cl-l"><path d="M-6 96 q4-7 10-5 q4-8 12-4 q6-3 10 3 q6 0 8 6 h22 q-30 2-62 0z"/>
      <path d="M-10 140 q5-6 10-4 q5-7 11-3 q6 0 8 5 h20 q-28 2-49 2z"/>
      <path d="M-4 176 q4-5 9-3 q4-5 9-2 q5 0 6 5 h14 q-20 2-38 0z"/></g>
    <g class="cl-r"><path d="M116 118 q-4-7-10-5 q-5-8-13-4 q-6-3-10 3 q-6 0-8 6 h-22 q32 2 63 0z"/>
      <path d="M114 162 q-4-6-10-4 q-5-7-11-3 q-6 0-8 5 h-18 q26 2 47 2z"/></g>
  </g>

  <g id="bats" class="bat">
    <g class="f1"><path class="wing" d="M0 0 q2-2 4 0 q2-2 4 0 q-2 0-4 1.5 q-2-1.5-4-1.5z" fill="#03070c"/></g>
    <g class="f2"><path class="wing" d="M0 0 q2-2 4 0 q2-2 4 0 q-2 0-4 1.5 q-2-1.5-4-1.5z" fill="#03070c"/></g>
  </g>

  <g class="land">
    <path d="M0 192 L8 182 L14 188 L22 170 L30 166 L40 160 L54 158 L68 160 L76 164 L82 154 L86 162 L94 170 L100 166 L108 180 V234 H0z" fill="url(#landG)"/>
    <path d="M22 170 L30 166 L40 160 L54 158 L68 160 L76 164 L82 154 L86 162" fill="none" stroke="#25637a" stroke-width=".7" stroke-linejoin="round" opacity=".9"/>
    <g fill="#12283a"><path d="M12 204 l7-5 -2 6z"/><path d="M88 194 l9-6 -1 7z"/><path d="M80 214 l8-5 -2 6z"/><path d="M94 222 l7-4 -1 5z"/></g>
    <g id="castle" fill="#03070c"></g>
    <g id="windows" fill="#5fd3e6"></g>
    <g class="door"><ellipse cx="54" cy="158" rx="10" ry="4" fill="url(#doorG)" opacity=".6"/>
      <path d="M52 156 v-7 q2-3 4 0 v7z" fill="#8fe6f2" filter="url(#glow)"/></g>
    <use href="#roadPath" class="road" fill="none" stroke="#25637a" stroke-width="2.2" stroke-linecap="round"/>
    <use href="#roadPath" class="road" fill="none" stroke="#3fa6bd" stroke-width=".6" stroke-linecap="round" opacity=".7"/>
    <circle class="walker" r="1.1" fill="#c4f3fa" filter="url(#glow)" style="offset-path:path('M60 234 C 30 228, 16 220, 34 212 S 76 200, 52 192 S 26 180, 46 172 S 66 162, 58 158 L 54 156')"/>
  </g>

</svg>
</template>

<script>
const towers=[[28,7,128,18],[36,4,138,10],[40,8,116,20],[48,12,106,30],[60,8,118,18],[68,4,136,10],[72,8,130,18],[44,3,114,8],[58,3,112,8]];
const windows=[[31,136],[31,143],[43,124],[43,134],[53,116],[55,116],[54,126],[64,126],[64,136],[75,138],[75,145],[37,146],[69,144]];
function build(){
  const ph=document.getElementById('phone'); ph.innerHTML='';
  ph.append(document.getElementById('scene').content.cloneNode(true));
  const NS='http://www.w3.org/2000/svg', svg=ph.querySelector('svg');
  const el=(n,a)=>{const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); return e;};
  const castle=svg.querySelector('#castle');
  castle.append(el('rect',{x:30,y:142,width:48,height:24}));
  towers.forEach(([x,w,top,s])=>{
    castle.append(el('rect',{x,y:top,width:w,height:166-top}));
    castle.append(el('rect',{x:x-.6,y:top,width:w+1.2,height:1}));
    castle.append(el('path',{d:`M${x-.3} ${top} L${x+w/2} ${top-s} L${x+w+.3} ${top}z`}));
  });
  // central gothic window
  const wins=svg.querySelector('#windows');
  windows.forEach(([x,y],i)=>{ const r=el('rect',{x:x-.1,y,width:1.2,height:3,rx:.6,class:'win'}); r.style.animationDelay=(2.15+i*.06)+'s'; wins.append(r); });
  const gw=el('path',{d:'M52 134 v-5 q2-3 4 0 v5z',class:'win',fill:'#3fa6bd'}); gw.style.animationDelay='2.5s'; wins.append(gw);
  const stars=svg.querySelector('#stars');
  const rand=n=>{const v=Math.sin(n*12.9898+78.233)*43758.547; return v-Math.floor(v);};
  for(let i=0;i<34;i++){ const s=el('circle',{cx:rand(i*2)*108,cy:rand(i*2+1)*70+4,r:i%5?.35:.6,fill:'#cfeaf2',class:'star'});
    s.style.animationDelay=`${1+(i%7)*.08}s, ${2+(i%5)*.4}s`; stars.append(s); }
}
document.getElementById('replay').onclick=build;
(document.fonts?document.fonts.load('800 22px Estedad'):Promise.resolve()).catch(()=>{}).then(build);
</script>
</body>
</html>
