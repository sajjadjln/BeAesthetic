<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash And Name</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap">
<style>
:root { --page: #e4e9ec; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #05090d; } }
:root[data-theme="dark"] { --page: #05090d; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--page); font-family: "Estedad", system-ui, sans-serif; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 16px; color: #233; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { color: #cdd; } }
.cap { max-width: 380px; font: 500 13px/1.6 system-ui, sans-serif; }
.cap b { display: block; font-size: 15px; margin-bottom: 4px; }
.lbl { font: 700 11px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.ctl { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 400px; }
.ctl button { font: 600 12.5px system-ui, sans-serif; padding: 7px 12px; border-radius: 16px; border: 1px solid #8aa3; background: none; color: inherit; cursor: pointer; }
.ctl button.on { background: #12283a; color: #5fd3e6; border-color: #5fd3e6; }

.phone { width: 360px; max-width: 100%; height: 760px; border-radius: 38px; overflow: hidden; position: relative;
  background: radial-gradient(120% 70% at 50% 40%, #12283a, #0b1622 55%, #060b11); color: #f2f7fa; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.stars { position: absolute; inset: 0; }
.stars i { position: absolute; width: 2px; height: 2px; background: #cfeaf2; opacity: 0; animation: tw 3s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: 0; } 50% { opacity: .8; } }
.fog { position: absolute; inset: auto -20% -10%; height: 45%; background: radial-gradient(60% 60% at 50% 100%, rgba(95,211,230,.12), transparent 70%); z-index: 3; pointer-events: none; }
.stage { position: absolute; inset: 0; }

/* shared: a full-size figure, its dark backdrop faded away */
.fig { position: absolute; opacity: 0; }
.fig img { width: 100%; display: block;
  -webkit-mask: radial-gradient(48% 50% at 50% 48%, #000 62%, transparent 100%); mask: radial-gradient(48% 50% at 50% 48%, #000 62%, transparent 100%); }
.fig .glow { position: absolute; inset: 10% 0 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--rgb),.4), transparent); }
.fig .bob { position: relative; animation: bob 4.5s ease-in-out infinite; animation-delay: var(--d); }
@keyframes bob { 50% { transform: translateY(-5px); } }

/* the name */
.name { position: absolute; inset-inline: 0; top: 70%; text-align: center; z-index: 4; }
.name h1 { font: 800 46px/1.2 "Estedad"; opacity: 0; transform: translateY(14px);
  background: linear-gradient(90deg, #5fd3e6, #b98cff, #ff5a6a, #cfd6dd, #5fd3e6); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.name .en { font: 700 13px "Estedad"; letter-spacing: .35em; color: #a9bccb; opacity: 0; margin-top: 4px; }
.name .tl { font: 500 13px "Estedad"; color: #6f8799; opacity: 0; margin-top: 14px; }
.go .name h1 { animation: rise .9s ease-out var(--t-name) forwards, shine 6s linear calc(var(--t-name) + 1s) infinite; }
.go .name .en { animation: fade .8s ease-out calc(var(--t-name) + .4s) forwards; }
.go .name .tl { animation: fade .8s ease-out calc(var(--t-name) + .8s) forwards; }
.load { position: absolute; bottom: 44px; left: 50%; width: 120px; margin-left: -60px; display: flex; gap: 3px; opacity: 0; z-index: 4; }
.load i { flex: 1; height: 6px; background: rgba(255,255,255,.1); }
.go .load { animation: fade .4s calc(var(--t-name) + 1s) forwards; }
.go .load i { animation: fill .2s steps(1) forwards; animation-delay: calc(var(--t-name) + 1.2s + var(--n) * .12s); }
@keyframes fill { to { background: #5fd3e6; box-shadow: 0 0 6px #5fd3e6; } }
@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 1; } }
@keyframes shine { to { background-position: 300% 0; } }

/* ① gather: portraits meet in one light */
.m-gather { --t-name: 2.4s; }
.m-gather .ch { position: absolute; left: 50%; top: 38%; width: 112px; height: 112px; margin: -56px; opacity: 0; transform: translate(var(--x), var(--y)); }
.m-gather .ch .g { position: absolute; inset: -26px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--rgb),.45), rgba(var(--rgb),0) 65%); }
.m-gather .ch .f { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; -webkit-mask: radial-gradient(circle, #000 56%, transparent 71%); mask: radial-gradient(circle, #000 56%, transparent 71%); }
.m-gather .ch img { width: 100%; height: 100%; }
.m-gather.go .ch { animation: arrive 1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--in); }
@keyframes arrive { from { opacity: 0; transform: translate(calc(var(--x) * 1.9), calc(var(--y) * 1.9)) scale(.5); filter: blur(6px); } to { opacity: 1; transform: translate(var(--x), var(--y)); } }
.m-gather .core { position: absolute; left: 50%; top: 38%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; opacity: 0; background: #fff;
  box-shadow: 0 0 20px 8px rgba(95,211,230,.8), 0 0 60px 30px rgba(185,140,255,.35), 0 0 90px 50px rgba(255,90,106,.18); }
.m-gather.go .core { animation: core 1.6s ease-out 1.9s forwards; }
@keyframes core { 0% { opacity: 0; transform: scale(.2); } 40% { opacity: 1; transform: scale(1.4); } 100% { opacity: .85; transform: scale(1); } }

/* ② lineup: the four stand together, rising out of the fog */
.m-line { --t-name: 2.6s; }
.m-line .fig { bottom: 30%; width: 150px; transform: translateY(40px); }
.m-line .fig:nth-child(1) { inset-inline-start: -6px; z-index: 1; }
.m-line .fig:nth-child(2) { inset-inline-start: 70px; z-index: 2; bottom: 31.5%; }
.m-line .fig:nth-child(3) { inset-inline-start: 140px; z-index: 2; bottom: 31.5%; }
.m-line .fig:nth-child(4) { inset-inline-start: 216px; z-index: 1; }
.m-line.go .fig { animation: up 1.3s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--in); }
@keyframes up { from { opacity: 0; transform: translateY(40px); filter: brightness(.3) blur(3px); } to { opacity: 1; transform: none; filter: none; } }

/* ③ spotlight: each one alone for a beat, then all four together */
.m-spot { --t-name: 4.6s; }
.m-spot .fig.solo { left: 50%; bottom: 18%; width: 300px; margin-left: -150px; }
.m-spot.go .fig.solo { animation: solo 1.2s ease-in-out forwards; animation-delay: var(--in); }
@keyframes solo { 0% { opacity: 0; transform: scale(1.06); } 30%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(.97); } }
.m-spot .fig.tog { bottom: 30%; width: 130px; transform: scale(.9); }
.m-spot.go .fig.tog { animation: tog .9s ease-out forwards; animation-delay: var(--in2); }
@keyframes tog { to { opacity: 1; transform: none; } }
.m-spot .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(var(--rgb),.35), transparent 60%); opacity: 0; }
.m-spot.go .flash { animation: solo 1.2s ease-in-out forwards; animation-delay: var(--in); }

/* ④ panels: four pixel doors slide open, one figure in each */
.m-door { --t-name: 2.6s; }
.m-door .door { position: absolute; top: 0; height: 70%; width: 25%; overflow: hidden; }
.m-door .door:nth-child(1) { inset-inline-start: 0; } .m-door .door:nth-child(2) { inset-inline-start: 25%; }
.m-door .door:nth-child(3) { inset-inline-start: 50%; } .m-door .door:nth-child(4) { inset-inline-start: 75%; }
.m-door .door .fig { position: absolute; bottom: 0; left: 50%; width: 230px; margin-left: -115px; opacity: 1; transform: translateY(100%); }
.m-door .door .fig img { -webkit-mask: linear-gradient(transparent, #000 15%, #000 80%, transparent); mask: linear-gradient(transparent, #000 15%, #000 80%, transparent); }
.m-door .door::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 -3px 0 rgba(var(--rgb),.9), inset 0 -40px 40px -20px rgba(var(--rgb),.35); opacity: 0; }
.m-door .door + .door::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 2px; background: repeating-linear-gradient(transparent 0 4px, rgba(255,255,255,.12) 4px 8px); z-index: 2; }
.m-door.go .door .fig { animation: slide 1s steps(10) forwards; animation-delay: var(--in); }
.m-door.go .door::after { animation: fade .5s forwards; animation-delay: calc(var(--in) + 1s); }
@keyframes slide { to { transform: none; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div class="lbl">Animation</div>
<div class="ctl" id="modes"></div>
<div class="lbl">Name</div>
<div class="ctl" id="names"></div>
<div class="phone" id="phone">
  <div class="stars" id="stars"></div>
  <div class="stage" id="stage"></div>
  <div class="fog"></div>
  <div class="name"><h1 id="nm"></h1><div class="en" id="en"></div><div class="tl" id="tl"></div></div>
  <div class="load"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i></div>
</div>
<div class="ctl"><button id="replay">▶ Replay</button></div>
<p class="cap" id="cap"></p>

const NAMES = [
  { fa: 'فانوس', en: 'LANTERN', tl: 'یه چراغ برای هر روز' },
  { fa: 'شب‌تاب', en: 'SHABTAB', tl: 'تو تاریکی هم راه رو نشون می‌ده' },
    { fa: 'قدم', en: 'QADAM', tl: 'قدم کوچیک، ولی هر روز' },
  { fa: 'همراه', en: 'HAMRAH', tl: 'کنارتم، هر روز' },
  { fa: 'سپیده', en: 'SEPIDEH', tl: 'هر روز یه شروع تازه' },

  { fa: 'پیکر', en: 'PEYKAR', tl: 'نام قبلی' },
];
// left to right on screen
const CAST = [
  { k: 'wizard',  rgb: '207,214,221' },
  { k: 'knight',  rgb: '95,211,230' },
  { k: 'goth',    rgb: '185,140,255' },
  { k: 'vampire', rgb: '255,90,106' },
];
const MODES = {
  line:   { en: '1 · Lineup (full size)', cap: 'The four, full size, stand side by side and rise out of the fog one after another, each with its own glow; the knight and the goth woman in front. They keep breathing gently while the name rises under them. About 4 s.' },
  spot:   { en: '2 · Spotlight', cap: 'Each one gets the stage alone for a beat, full size, with a flash of its color: wizard, knight, goth woman, vampire. Then all four step in together and the name appears. About 6 s; the longest, so best kept for the first launch.' },
  door:   { en: '3 · Pixel doors', cap: 'The screen splits into four pixel columns. One figure slides up in each, in game-like steps, and a line of its color lights the bottom of its column. Then the name. About 4 s; the most "game" of the four.' },
  gather: { en: '4 · Gather (portraits)', cap: '<b style="display:inline;font-size:inherit">Chosen (D190).</b> The four portraits drift in from the dark and meet in one light at the center. The first version: the four portraits drift in from the dark and meet in one light at the center. About 4 s; the calmest.' },
};
const stage = document.getElementById('stage'), phone = document.getElementById('phone');
const fig = (c, extra = '') => `<div class="fig ${extra}" style="--rgb:${c.rgb};--d:${-Math.random() * 4}s;@S@"><div class="bob"><div class="glow"></div><img alt="" src="${FULL[c.k]}"></div></div>`;
function build(m) {
  phone.className = 'phone m-' + m;
  let h = '';
  if (m === 'line') {
    const order = [0, 1, 2, 3], delay = [.9, .3, .6, 1.2];
    h = order.map(i => fig(CAST[i]).replace('@S@', `--in:${delay[i]}s`)).join('');
  } else if (m === 'spot') {
    h = CAST.map((c, i) => `<div class="flash" style="--rgb:${c.rgb};--in:${.3 + i * 1}s"></div>` + fig(c, 'solo').replace('@S@', `--in:${.3 + i * 1}s`)).join('');
    h += CAST.map((c, i) => fig(c, 'tog').replace('@S@', `--in2:${4.2 + i * .1}s;inset-inline-start:${[-4, 72, 144, 224][i]}px`)).join('');
  } else if (m === 'door') {
    h = CAST.map((c, i) => `<div class="door" style="--rgb:${c.rgb};--in:${.3 + i * .35}s">` + fig(c).replace('@S@', '') + '</div>').join('');
  } else {
    const pos = { knight: [0, -96], vampire: [96, 0], goth: [0, 96], wizard: [-96, 0] };
    h = CAST.map((c, i) => `<div class="ch" style="--x:${pos[c.k][0]}px;--y:${pos[c.k][1]}px;--rgb:${c.rgb};--in:${.5 + i * .35}s"><div class="g"></div><div class="f"><img alt="" src="${ART[c.k]}"></div></div>`).join('') + '<div class="core"></div>';
  }
  stage.innerHTML = h;
  document.getElementById('cap').innerHTML = `<b>Splash: ${MODES[m].en}</b>${MODES[m].cap} Stars and fog in all of them; the name shines through the four colors, then the English name, the tagline and a pixel bar.`;
  [...document.getElementById('modes').children].forEach(b => b.classList.toggle('on', b.dataset.m === m));
  play();
}
function play() { phone.classList.remove('go'); void phone.offsetWidth; phone.classList.add('go'); }
function setName(i) {
  const n = NAMES[i];
  document.getElementById('nm').textContent = n.fa; document.getElementById('en').textContent = n.en; document.getElementById('tl').textContent = n.tl;
  [...document.getElementById('names').children].forEach((b, j) => b.classList.toggle('on', i === j)); play();
}
for (const m in MODES) { const b = document.createElement('button'); b.dataset.m = m; b.textContent = MODES[m].en; b.onclick = () => build(m); document.getElementById('modes').appendChild(b); }
NAMES.forEach((n, i) => { const b = document.createElement('button'); b.textContent = n.fa + ' · ' + n.en[0] + n.en.slice(1).toLowerCase(); b.onclick = () => setName(i); document.getElementById('names').appendChild(b); });
document.getElementById('replay').onclick = play;
const stars = document.getElementById('stars');
for (let i = 0; i < 50; i++) { const s = document.createElement('i');
  s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${Math.random() * 3}s;animation-duration:${2 + Math.random() * 3}s`; stars.appendChild(s); }

// knight: embers red → cyan (D183 ①), for both images
function recolor(src, cb) { const img = new Image(); img.onload = () => {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let j = 0; j < p.length; j += 4) { const r = p[j], g = p[j+1], b = p[j+2];
    if (r > g + 30 && r > b + 20) { p[j] = g >> 1; p[j+1] = Math.min(255, r + 60); p[j+2] = Math.min(255, r + 80); } }
  x.putImageData(d, 0, 0); cb(c.toDataURL('image/jpeg', .85)); }; img.src = src; }
recolor(FULL.knight, u => { FULL.knight = u; recolor(ART.knight, v => { ART.knight = v; setName(0); build('gather'); }); });
