<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step Two Knight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;600;700;800&display=swap">
<style>
:root { --page:#e4e9ec; --ink:#233; --sky1:#0b1622; --sky2:#12283a; --glow:#5fd3e6; --t1:#f2f7fa; --t2:#a9bccb; --t3:#6f8799; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#05090d; --ink:#cdd; } }
:root[data-theme="dark"] { --page:#05090d; --ink:#cdd; }
* { box-sizing:border-box; margin:0; }
body { background:var(--page); color:var(--ink); font-family:"Estedad",system-ui,sans-serif; padding:24px 16px; }
h1 { font:800 20px system-ui,sans-serif; text-align:center; margin-bottom:4px; }
.lead { text-align:center; font:500 13px/1.6 system-ui,sans-serif; max-width:640px; margin:0 auto 22px; }
.grid { display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
figure { width:320px; max-width:100%; }
figcaption { font:500 12.5px/1.6 system-ui,sans-serif; margin-top:10px; } figcaption b { display:block; font-size:14px; margin-bottom:3px; }
.phone { height:660px; border-radius:34px; overflow:hidden; display:flex; flex-direction:column; color:var(--t1); position:relative;
  background:radial-gradient(120% 70% at 50% 18%,var(--sky2),var(--sky1) 70%); box-shadow:0 16px 44px rgba(0,0,0,.3); }
.status { display:flex; justify-content:space-between; padding:12px 22px 0; font-size:11px; color:var(--t2); }
.title { text-align:center; color:var(--glow); font-weight:800; font-size:16px; padding:10px 20px 0; text-shadow:0 0 10px rgba(95,211,230,.35); }
.center { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 20px; }
.talk { display:flex; align-items:center; gap:10px; padding:16px 18px 0; }
.talk.col { flex-direction:column; gap:14px; }
.talk.low { padding:0 18px 10px; align-items:flex-end; }
.mug { width:84px; height:84px; flex:none; clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); box-shadow:none; outline:3px solid #cdeff6; animation:breathe 5s ease-in-out infinite; }
.b .mug { width:96px; height:96px; }
.mug.round { width:120px; height:120px; border-radius:50%; clip-path:none; outline:0; -webkit-mask:radial-gradient(circle,#000 58%,transparent 71%); mask:radial-gradient(circle,#000 58%,transparent 71%); }
@keyframes breathe { 50% { transform:translateY(-3px); } }
.say { position:relative; flex:1; background:linear-gradient(#0f2232,#0a1520); font:700 14px/1.6 "Estedad"; padding:16px 14px 10px; min-height:54px;
  box-shadow:inset 0 0 0 3px #cdeff6, inset 0 0 0 6px #0a1520, inset 0 0 0 8px #2a6478; clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); }
.talk.col .say { width:100%; }
.tag { position:absolute; top:5px; inset-inline-start:12px; font-size:10px; color:var(--glow); font-weight:800; }
.b .say::after { content:""; position:absolute; bottom:-1px; inset-inline-end:40px; width:8px; height:8px; background:#cdeff6; }
.tl { display:flex; flex-direction:column; align-items:center; gap:6px; }
.big { font:800 38px/1.2 "Estedad"; color:var(--glow); text-shadow:0 0 14px rgba(95,211,230,.45); }
.ends { font-size:13px; color:var(--t2); }
.track { position:relative; width:100%; height:64px; margin-top:8px; }
.track::before { content:""; position:absolute; inset-inline:0; top:14px; height:10px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); }
.fill { position:absolute; inset-inline-start:0; top:14px; height:10px; background:repeating-linear-gradient(90deg,var(--glow) 0 6px,rgba(95,211,230,.7) 6px 8px); box-shadow:0 0 10px rgba(95,211,230,.5); }
.marks span { position:absolute; top:0; transform:translateX(50%); display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:var(--t3); white-space:nowrap; }
.marks span::before { content:""; width:4px; height:36px; background:rgba(255,255,255,.22); }
.marks span.hit { color:var(--t1); } .marks span.nz { color:var(--glow); font-weight:700; } .marks span.nz::before { background:var(--glow); }
.track input { position:absolute; inset:0; width:100%; height:40px; margin:0; -webkit-appearance:none; appearance:none; background:none; direction:rtl; }
.track input::-webkit-slider-runnable-track { height:40px; background:none; }
.track input::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:30px; margin-top:4px; background:#e9fbff; cursor:grab; box-shadow:inset 0 0 0 3px var(--glow),0 0 12px rgba(95,211,230,.8); clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); }
.beyond { height:40px; padding:0 16px; border:0; background:rgba(95,211,230,.16); color:var(--glow); font:700 13px "Estedad"; box-shadow:inset 0 0 0 2px var(--glow); clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); visibility:hidden; }
.beyond.show { visibility:visible; }
.bar { display:flex; align-items:center; gap:12px; padding:0 20px 26px; }
.steps { flex:1; display:flex; gap:4px; } .steps i { flex:1; height:10px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); }
.steps i.done { background:var(--glow); opacity:.55; } .steps i.cur { box-shadow:inset 0 0 0 2px var(--glow); background:linear-gradient(90deg,var(--glow) 0 100%); }
.go { width:48px; height:48px; border:0; background:var(--glow); color:#06202a; font:800 26px/1 "Estedad"; clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); }
</style></head><body>
<h1>Step ② · smaller knight, new face: three options</h1>
<p class="lead">In all three the slider moves to the middle of the screen and the knight gets smaller, with another mood from his sheet (cyan embers, same art). Drag any slider; the knight answers in his dialog.</p>

<div class="status"><span>۱۹:۴۲</span><span>۸۵٪</span></div>

<div class="talk row"><canvas class="mug" width="300" height="300"></canvas><div class="say"><span class="tag">شوالیه</span><span class="txt">تا کِی؟</span></div></div><div class="center"><div class="tl"><div class="big">۶۰ روز</div><div class="ends">۴ دی ۱۴۰۵</div>
<div class="track"><div class="fill"></div><div class="marks"></div><input type="range" min="0" max="1000" value="300" aria-label="تا کِی"></div>

<div class="track"><div class="fill"></div><div class="marks"></div><input type="range" min="0" max="1000" value="300" aria-label="تا کِی"></div>
<button class="beyond">بیشتر از یه سال؟ از تقویم انتخاب کن</button></div></div><div class="talk low"><div class="say"><span class="tag">شوالیه</span><span class="txt">تا کِی؟</span></div><canvas class="mug" width="300" height="300"></canvas></div>

<div class="track"><div class="fill"></div><div class="marks"></div><input type="range" min="0" max="1000" value="300" aria-label="تا کِی"></div>
