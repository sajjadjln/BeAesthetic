<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pikar Pixel Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0607; --fg:#f1d9d9; --muted:#9a7474; --accent:#e5262b; --line:#3a1a1c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b0607; } }
  :root[data-theme="dark"] { --bg:#0b0607; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font-family:Estedad, system-ui, sans-serif; display:flex; flex-direction:column;
         align-items:center; padding:24px 16px; gap:16px; }
  .phone { width:min(360px, 100%); aspect-ratio:9/16; border-radius:28px; overflow:hidden;
           box-shadow:0 0 0 1px var(--line), 0 30px 80px #000; background:#000; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; color:var(--fg); background:#1a0d0e; border:1px solid var(--line);
           padding:8px 16px; border-radius:10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  p { color:var(--muted); font-size:13px; max-width:360px; text-align:center; line-height:1.8; margin:0; }
</style>
</head>
<body>
<div class="phone"><canvas id="c" width="108" height="192"></canvas></div>
<div class="bar">
  <button id="replay">پخش دوباره</button>
  <button id="speed">سرعت: ۱×</button>
</div>
<p>اسپلش پیکسلی «پیکر»: ماه سرخ بالا می‌آید، قلعه از دل کوه سر درمی‌آورد، راه تا در روشن می‌شود، پنجره‌ها یکی‌یکی روشن می‌شوند و اسم با دیزر پیکسلی ظاهر می‌شود. حدود ۴٫۵ ثانیه، بعد حالت آرام.</p>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 108, H = 192;
ctx.imageSmoothingEnabled = false;

// palette (limited, pixel-art)
const P = {
  // knight theme (DESIGN.md): cyan #5FD3E6 on night blue #0B1622 → #12283A
  void:'#050b12', night:'#0b1622', dusk:'#12283a', ember:'#1b3d55',
  blood:'#25637a', red:'#3fa6bd', moon:'#5fd3e6', glow:'#8fe6f2', pale:'#c4f3fa',
  ink:'#03070c', rock:'#03070c'
};
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const dith = (x,y,t) => (BAYER[y&3][x&3] + .5) / 16 < t;
const px = (x,y,c) => { ctx.fillStyle=c; ctx.fillRect(x|0,y|0,1,1); };
const rect = (x,y,w,h,c) => { ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); };
const clamp = v => v<0?0:v>1?1:v;
const ease = t => 1 - Math.pow(1-clamp(t),3);
const seg = (t,a,b) => clamp((t-a)/(b-a));

// deterministic noise for craters
function hash(x,y){ let h = x*374761393 + y*668265263; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const s=t=>t*t*(3-2*t), a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*s(xf)+(c-a)*s(yf)+(a-b-c+d)*s(xf)*s(yf); }

// ---------- scene pieces ----------
function sky(t){
  const bands=[P.void,P.night,P.dusk,P.ember];
  for(let y=0;y<H;y++){
    // darkest top, reddish around horizon (~y 120)
    let v = 1 - Math.abs(y-118)/118; v = clamp(v)*3*ease(seg(t,0,1400));
    const i = Math.min(2, Math.floor(v)), f = v - i;
    for(let x=0;x<W;x++) px(x,y, dith(x,y,f) ? bands[i+1] : bands[i]);
  }
}

function moon(t,now){
  const cx=54, r=34, cy = 70 + 40*(1-ease(seg(t,0,1600)));
  const a = ease(seg(t,100,1600));
  const pulse = .04*Math.sin(now/900);
  for(let y=-r-3;y<=r+3;y++) for(let x=-r-3;x<=r+3;x++){
    const d = Math.hypot(x,y), X=cx+x, Y=(cy+y)|0;
    if(X<0||X>=W||Y<0||Y>=H) continue;
    if(d<=r){
      const n = vnoise((x+40)/7,(y+40)/7)*.65 + vnoise((x+9)/3,(y+9)/3)*.35;
      let c = n>.62 ? P.red : n>.56 ? (dith(X,Y,.5)?P.red:P.moon) : P.moon;
      if(d>r-1.2) c = P.red;
      if(n<.3 && dith(X,Y,.35+pulse)) c = P.glow;
      if(dith(X,Y,a)) px(X,Y,c);
    } else if(d<=r+3 && dith(X,Y,(1-(d-r)/3)*.35*a)) px(X,Y,P.blood);
  }
}

const CLOUDS = [
  {y:52, x:-6, w:30, dir: 1, sp:.0016}, {y:74, x:84, w:32, dir:-1, sp:.0012},
  {y:96, x:-10,w:26, dir: 1, sp:.0010}, {y:118,x:86, w:28, dir:-1, sp:.0014},
  {y:132,x:-4, w:22, dir: 1, sp:.0009}
];
function clouds(t,now){
  const a = ease(seg(t,500,1800));
  for(const c of CLOUDS){
    const drift = Math.sin(now*c.sp)*4*c.dir;
    const bx = c.x + drift + (1-a)*-14*c.dir;
    // puffy top: three bumps + long flat tail
    const bumps=[[.25,4],[.5,6],[.75,4]];
    for(let x=0;x<c.w;x++){
      let top=0; for(const [p,h] of bumps){ const dx=(x/c.w-p)*c.w; top=Math.max(top, h*h-dx*dx>0?Math.sqrt(h*h-dx*dx):0); }
      const X=(bx+x)|0;
      for(let y=-Math.round(top);y<=1;y++){
        const Y=c.y+y; const edge = y===-Math.round(top);
        if(dith(X,Y,a)) px(X,Y, edge?P.blood:P.ember);
      }
      if(dith(X,c.y+2,a*.8)) px(X,c.y+2,P.night);
    }
    // thin tail
    const tx = c.dir>0 ? bx+c.w : bx-12;
    for(let x=0;x<12;x++) if(dith((tx+x)|0,c.y+1,a*(c.dir>0?1-x/12:x/12))) px(tx+x,c.y+1,P.ember);
  }
}

// mountain silhouette (left->right heights), jagged
const MOUNT = [];
(function(){
  const pts=[[0,150],[8,140],[14,146],[22,128],[30,124],[40,118],[54,116],[68,118],[76,122],[82,112],[86,120],[94,128],[100,124],[108,138]];
  for(let x=0;x<W;x++){
    let i=0; while(pts[i+1][0]<x) i++;
    const [x0,y0]=pts[i],[x1,y1]=pts[i+1];
    MOUNT[x] = Math.round(y0+(y1-y0)*(x-x0)/(x1-x0) + (hash(x,7)-.5)*2);
  }
})();
const TOWERS = [ // x, w, roofY (top of wall), spire height
  {x:28,w:7,top:86,s:18},{x:36,w:4,top:96,s:10},{x:40,w:8,top:74,s:20},
  {x:48,w:12,top:64,s:30},{x:60,w:8,top:76,s:18},{x:68,w:4,top:94,s:10},{x:72,w:8,top:88,s:18},
  {x:44,w:3,top:72,s:8},{x:58,w:3,top:70,s:8}
];
const WINDOWS = [[31,94],[31,101],[43,82],[43,92],[53,74],[55,74],[54,84],[64,84],[64,94],[75,96],[75,103],[37,104],[69,102]];
const PATH = [[60,192],[40,184],[22,176],[44,168],[70,160],[46,150],[30,142],[52,134],[62,126],[56,118],[54,114]];

function castle(t,now){
  const rise = 22*(1-ease(seg(t,900,2100)));
  ctx.save(); ctx.translate(0, Math.round(rise));
  // keep body
  rect(30,100,48,24,P.ink);
  for(const tw of TOWERS){
    rect(tw.x,tw.top,tw.w,124-tw.top,P.ink);
    // little ledge
    rect(tw.x-1,tw.top,tw.w+2,1,P.ink);
    // spire
    const cx = tw.x + tw.w/2;
    for(let i=0;i<tw.s;i++){
      const half = (tw.w/2+.5)*(i/tw.s);
      rect(Math.round(cx-half), tw.top-tw.s+i, Math.max(1,Math.round(half*2)), 1, P.ink);
    }
  }
  // windows light up one by one
  const wl = seg(t,2700,3700);
  WINDOWS.forEach(([x,y],i)=>{
    const on = wl*WINDOWS.length > i;
    const flick = hash(i, Math.floor(now/180)) > .97;
    if(on && !flick){ rect(x,y,1,3,P.moon); px(x,y,P.red); }
  });
  // central gothic window
  if(wl>.5){ rect(52,86,4,6,P.red); rect(53,85,2,1,P.red); px(54,88,P.ink); rect(52,89,4,1,P.ink); }
  // door arch glow
  const dg = ease(seg(t,3300,3900));
  if(dg>0){
    const g = .7 + .3*Math.sin(now/300);
    for(let y=0;y<10;y++){
      const w = y<2? 2 : 4;
      for(let x=0;x<w;x++){ const X=52+(4-w)/2+x, Y=104+y; if(dith(X,Y,dg)) px(X,Y, dith(X,Y,g)?P.moon:P.red); }
    }
    // spill
    for(let y=114;y<118;y++) for(let x=48;x<60;x++) if(dith(x,y,dg*.25*(1-(y-114)/4))) px(x,y,P.blood);
  }
  ctx.restore();
}

function mountain(t){
  const rise = 22*(1-ease(seg(t,900,2100)));
  for(let x=0;x<W;x++){
    const top = MOUNT[x] + Math.round(rise);
    for(let y=top;y<H;y++) px(x,y,P.rock);
    // red rim light on the ridge facing the moon
    if(dith(x,top,.75)) px(x,top, x>30&&x<80 ? P.blood : P.ember);
  }
  // jagged red scars (like the reference)
  const scars=[[14,160,6],[90,150,8],[80,170,7],[20,186,5],[96,180,6],[36,130,4]];
  const a = ease(seg(t,1500,2400));
  for(const [sx,sy,l] of scars) for(let i=0;i<l;i++){
    const X=sx+i, Y=sy+Math.round(rise)-i*(i%2?1:2)*.6; if(dith(X|0,Y|0,a*.8)) px(X,Y,P.ember);
  }
}

function path(t){
  const p = ease(seg(t,1900,3300)); if(p<=0) return;
  const rise = 22*(1-ease(seg(t,900,2100)));
  // total length
  let L=0; const lens=[]; for(let i=1;i<PATH.length;i++){ const d=Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]); lens.push(d); L+=d; }
  let budget = L*p, head=null;
  for(let i=1;i<PATH.length && budget>0;i++){
    const [x0,y0]=PATH[i-1],[x1,y1]=PATH[i]; const d=lens[i-1], use=Math.min(d,budget);
    const steps=Math.ceil(use*1.5);
    for(let s=0;s<=steps;s++){
      const f=(use/d)*(s/steps), X=Math.round(x0+(x1-x0)*f), Y=Math.round(y0+(y1-y0)*f+rise);
      const w = Math.max(1, Math.round((Y-110)/26)); // wider near the viewer
      rect(X-(w>>1),Y,w,1,P.blood); if(w>1) px(X-(w>>1)-1,Y,P.ember);
      head=[X,Y];
    }
    budget-=use;
  }
  // a little lantern walking the path
  if(head && p<1){ px(head[0],head[1]-1,P.pale); px(head[0],head[1]-2,P.glow); }
}

const BATS=[{x:20,y:40,s:.018,o:0},{x:80,y:30,s:.022,o:2},{x:66,y:56,s:.015,o:4}];
function bats(t,now){
  if(t<2400) return;
  BATS.forEach(b=>{
    const x = (b.x + now*b.s*0.6) % (W+20) - 10, y = b.y + Math.sin(now/400+b.o)*3;
    const up = Math.floor(now/140+b.o)%2;
    px(x,y,P.ink); px(x+1,y,P.ink);
    if(up){ px(x-1,y-1,P.ink); px(x+2,y-1,P.ink); } else { px(x-1,y+1,P.ink); px(x+2,y+1,P.ink); }
  });
}

// pixel-ized title: render text small, threshold, then reveal with dither
let titleMask=null;
function buildTitle(){
  const o=document.createElement('canvas'); o.width=W; o.height=30; const c=o.getContext('2d');
  c.fillStyle='#fff'; c.textAlign='center'; c.textBaseline='middle';
  c.font='800 20px Estedad, sans-serif'; c.direction='rtl';
  c.fillText('پیکر', W/2, 15);
  const d=c.getImageData(0,0,W,30).data; titleMask=[];
  for(let y=0;y<30;y++) for(let x=0;x<W;x++) if(d[(y*W+x)*4+3]>110) titleMask.push([x,y]);
}
function title(t,now){
  if(!titleMask) return;
  const a = seg(t,3800,4700); if(a<=0) return;
  const oy = 8 + Math.round(4*(1-ease(a)));
  const set = new Set(titleMask.map(([x,y])=>x+','+y));
  // dark plate behind for legibility
  for(let y=oy-2;y<oy+32;y++) for(let x=0;x<W;x++) if(dith(x,y,.55*ease(a)*(1-Math.abs(y-oy-15)/17))) px(x,y,P.void);
  for(const [x,y] of titleMask){
    const Y=oy+y;
    if(!set.has(x+','+(y-1)) && dith(x,Y,a)) px(x,Y-1,P.blood);  // top shadow-rim
    if(dith(x,Y,a)) px(x,Y, y<12 ? P.pale : P.moon);
  }
  // shimmer sweep once
  const sw = seg(t,4700,5600)*(W+20)-10;
  for(const [x,y] of titleMask) if(Math.abs(x-sw+y*.3)<1.5) px(x,oy+y,'#eafcff');
}

function frame(){
  // rounded red border like the reference, in pixels
  const a = ease(seg(t0now,3600,4300));
  const r=8, m=3;
  for(let x=m+r;x<W-m-r;x++){ if(dith(x,m,a)) px(x,m,P.moon); if(dith(x,H-m-1,a)) px(x,H-m-1,P.moon); }
  for(let y=m+r;y<H-m-r;y++){ if(dith(m,y,a)) px(m,y,P.moon); if(dith(W-m-1,y,a)) px(W-m-1,y,P.moon); }
  for(let i=0;i<=24;i++){ const ang=i/24*Math.PI/2, dx=Math.round(r-r*Math.cos(ang)), dy=Math.round(r-r*Math.sin(ang));
    [[m+dx,m+dy],[W-m-1-dx,m+dy],[m+dx,H-m-1-dy],[W-m-1-dx,H-m-1-dy]].forEach(([x,y])=>{ if(dith(x,y,a)) px(x,y,P.moon); }); }
}

// ---------- loop ----------
let start=performance.now(), speed=1, t0now=0, last=0;
function tick(now){
  requestAnimationFrame(tick);
  if(now-last < 1000/24) return;           // 24fps: chunky, pixel-art feel
  last=now;
  const t=(now-start)*speed; t0now=t;
  sky(t); moon(t,now); clouds(t,now); mountain(t); path(t); castle(t,now); bats(t,now); title(t,now); frame();
}
document.getElementById('replay').onclick=()=>{ start=performance.now(); };
document.getElementById('speed').onclick=e=>{
  speed = speed===1?.5:speed===.5?2:1;
  e.target.textContent = 'سرعت: ' + (speed===1?'۱×':speed===.5?'۰٫۵×':'۲×'); start=performance.now();
};
(document.fonts ? document.fonts.load('800 20px Estedad') : Promise.resolve()).catch(()=>{}).then(()=>{ buildTitle(); start=performance.now(); });
requestAnimationFrame(tick);
</script>
</body>
</html>
